<svg width="200" height="80" viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond dégradé -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C8973A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D4A763;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8852E;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="200" height="80" rx="12" fill="url(#bgGradient)"/>
  
  <!-- "3S" DOMINANT et visible -->
  <g transform="translate(20, 25)">
    <!-- Grand chiffre 3 -->
    <text x="0" y="30" font-family="Arial Black, sans-serif" font-size="48" font-weight="900" fill="#FFFFFF">
      3
    </text>
    
    <!-- Grand S -->
    <text x="35" y="30" font-family="Arial Black, sans-serif" font-size="48" font-weight="900" fill="#FFFFFF">
      S
    </text>
  </g>
  
  <!-- "Bétail" plus petit mais visible -->
  <text x="120" y="45" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF" opacity="0.9">
    Bétail
  </text>
  
  <!-- Ligne de séparation -->
  <line x1="110" y1="20" x2="110" y2="60" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
  
  <!-- Cadre autour du 3S pour le mettre en valeur -->
  <rect x="15" y="15" width="65" height="50" rx="8" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Points décoratifs -->
  <circle cx="120" cy="55" r="2" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="135" cy="55" r="2" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="150" cy="55" r="2" fill="#FFFFFF" opacity="0.4"/>
</svg>
